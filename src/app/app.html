<div class="h-screen overflow-hidden bg-slate-900">
  <!-- Overlay (apenas mobile, quando o menu está aberto) -->
  <div
    *ngIf="sidebarOpen()"
    class="fixed inset-0 z-40 bg-black/60 md:hidden"
    (click)="closeSidebar()"
  ></div>

  <sidebar-component [isOpen]="sidebarOpen()" (closeMenu)="closeSidebar()"></sidebar-component>

  <div class="flex h-screen flex-col md:ml-64">
    <header-component (menuClick)="toggleSidebar()"></header-component>

    <main class="min-h-0 flex-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

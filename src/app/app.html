<div class="h-screen overflow-hidden bg-slate-900">
  <!-- Overlay (apenas mobile, quando o menu está aberto) -->
  <div
    *ngIf="sidebarOpen()"
    class="fixed inset-0 z-40 bg-black/60 md:hidden"
    (click)="closeSidebar()"
  ></div>

  <app-sidebar [isOpen]="sidebarOpen()" (closeMenu)="closeSidebar()"></app-sidebar>

  <div class="flex h-screen flex-col md:ml-64">
    <header (menuClick)="toggleSidebar()"></header>
    <main class="min-h-0 flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

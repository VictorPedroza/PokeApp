<div class="flex h-full flex-col overflow-hidden">
  <!-- Header -->
  <div class="shrink-0 border-b border-gray-500/20 px-4 py-6 sm:px-6">
    <p class="text-[12px] tracking-[0.2em] text-slate-600 uppercase">Índice</p>

    <h1 class="text-2xl font-bold text-slate-50 sm:text-3xl">
      Explore os Poke<span class="text-red-600">mon</span>
    </h1>

    <p class="mt-1 max-w-xl text-md text-slate-400">
      Navegue por todos os Pokémon e descubra informações, características e detalhes de cada
      espécie.
    </p>
  </div>

  <section class="shrink-0 group relative flex items-center border-b border-slate-700/40 px-4 py-3">
    <span
      class="cursor-pointer border border-slate-400/30 bg-slate-500/10 px-3 py-0.5 text-sm text-slate-300 transition-all duration-200 hover:border-slate-400/50 hover:bg-slate-500/20 hover:text-slate-200"
    >
      Todos
    </span>
  </section>

  @if (isLoading) {
    <loading-component></loading-component>
  } @else {
    @if (pokemons.length > 0) {
      <!-- Hero Card -->
      <div class="shrink-0">
        <pokemon-hero  [pokemon]="pokemons[0]"></pokemon-hero>
      </div>

      <!-- Área com scroll -->
      <div class="hide-scrollbar min-h-0 flex-1 overflow-y-auto">
        <div class="grid grid-cols-1 gap-2 sm:gap-0 md:grid-cols-2 cursor-pointer">
          <div *ngFor="let pokemon of pokemons">
            <pokemon-card [pokemon]="pokemon"></pokemon-card>
          </div>
        </div>
      </div>
    }
  }
</div>

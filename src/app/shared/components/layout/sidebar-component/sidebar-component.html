<div
  class="fixed inset-y-0 left-0 z-50 flex w-64 -translate-x-full flex-col border-r border-gray-500/20 md:bg-slate-800/30 bg-slate-800 transition-transform duration-300 ease-in-out md:translate-x-0"
  [class.translate-x-0]="isOpen"
>
  <!-- Logo -->
  <div
    class="flex h-16 shrink-0 items-center gap-3 border-b border-gray-500/20 px-4 sm:h-20 sm:px-6"
  >
    <div class="flex h-11 w-11 items-center justify-center">
      <img src="/images/pokeball.png" alt="PokeHub" class="h-12 w-12 object-contain" />
    </div>

    <h1 class="flex-1 text-3xl font-bold tracking-tighter text-white">
      Poke<span class="text-red-500">Hub</span>
    </h1>

    <button
      type="button"
      class="flex h-9 w-9 shrink-0 items-center justify-center text-slate-300 transition-colors hover:text-white md:hidden"
      (click)="closeMenu.emit()"
      aria-label="Fechar menu"
    >
      <svg lucideX class="h-6 w-6"></svg>
    </button>
  </div>

  <!-- Navegação -->
  <nav class="flex flex-1 flex-col gap-2 overflow-y-auto pt-4">
    <!-- Explorar -->
    <div class="flex flex-1 flex-col">
      <h1 class="pl-3 pb-0.5 text-[12px] tracking-[0.2em] text-slate-600 uppercase">Explorar</h1>
      <!-- Dashboard -->
      <sidebar-item label="Dashboard" routerLink="/">
        <svg lucideHome></svg>
      </sidebar-item>

      <!-- Pokedex -->
      <sidebar-item label="Pokedex" routerLink="/pokedex">
        <svg lucideBookOpen></svg>
      </sidebar-item>
    </div>
  </nav>
  <!-- Footer -->
  <footer class="shrink-0 border-t border-gray-500/20 px-4 py-2.5">
    <div class="flex items-center justify-between gap-3">
      <span class="text-[11px] text-slate-500"> Projeto para fins educacionais. </span>

      <a
        href="https://github.com/VictorPedroza/PokeApp.git"
        target="_blank"
        rel="noopener noreferrer"
        class="flex shrink-0 items-center gap-1.5 text-[11px] text-slate-400 transition-colors hover:text-white"
      >
        <svg class="h-3.5 w-3.5" lucideGithub></svg>
        <span>GitHub</span>
      </a>
    </div>
  </footer>
</div>
